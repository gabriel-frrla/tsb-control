sensor_processing_node:
  ros__parameters:
    heading:
      time_constant: 0.5

    # All timing values are in seconds.
    timing:
      input_timeout: 1.0
      future_tolerance: 0.1
      max_sample_separation: 0.1
      max_dt: 0.2

    frames:
      odom: odom
      base: base_footprint
      imu: turtlebot3_burger/imu_link/tb3_imu